# Builds ClearScriptV8 for eight RIDs, loads each on a machine that runs it, and on a tag publishes them as a release.
name: Build

on:
  workflow_dispatch:
    inputs:
      only:
        description: Only the RIDs starting so (win, linux-arm...), to try a fix; empty for all
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, runner: macos-15, cpu: arm64 }
          - { rid: osx-x64, runner: macos-15, cpu: x64 }
          - { rid: linux-x64, runner: ubuntu-24.04, cpu: x64 }
          - { rid: linux-arm64, runner: ubuntu-24.04, cpu: arm64 }
          - { rid: linux-arm, runner: ubuntu-24.04, cpu: arm }
          - { rid: win-x64, runner: windows-2022, cpu: x64 }
          - { rid: win-x86, runner: windows-2022, cpu: x86 }
          - { rid: win-arm64, runner: windows-2022, cpu: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Selected
        run: echo "SELECTED=${{ inputs.only == '' || startsWith(matrix.rid, inputs.only) }}" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v4
        if: env.SELECTED == 'true'
      - name: Free disk space
        if: env.SELECTED == 'true' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build
        if: env.SELECTED == 'true' && runner.os != 'Windows'
        run: ./build.sh "$RUNNER_TEMP/work" ${{ matrix.cpu }}
      - name: Build
        if: env.SELECTED == 'true' && runner.os == 'Windows'
        shell: pwsh
        # (on C:, which has room for V8: the runner's temporary folder is on a small drive)
        run: ./build.ps1 C:\v8work ${{ matrix.cpu }}
      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.rid }}
          path: |
            ${{ runner.os == 'Windows' && 'C:/v8work' || format('{0}/work', runner.temp) }}/ClearScript/V8/build/*.log
            ${{ runner.os == 'Windows' && 'C:/v8work' || format('{0}/work', runner.temp) }}/ClearScript/V8/build/v8/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: env.SELECTED == 'true'
        with:
          name: ${{ matrix.rid }}
          path: ${{ runner.os == 'Windows' && 'C:/v8work' || format('{0}/work', runner.temp) }}/out/
          if-no-files-found: error

  test:
    name: Test ${{ matrix.rid }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, runner: macos-15 }
          - { rid: osx-x64, runner: macos-15, dotnet: x64 }
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
          - { rid: linux-arm, runner: ubuntu-24.04, docker: linux/arm/v7 }
          - { rid: win-x64, runner: windows-2022 }
          - { rid: win-x86, runner: windows-2022, dotnet: x86 }
          - { rid: win-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Selected
        run: echo "SELECTED=${{ inputs.only == '' || startsWith(matrix.rid, inputs.only) }}" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v4
        if: env.SELECTED == 'true'
      - uses: actions/setup-dotnet@v4
        if: env.SELECTED == 'true'
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        if: env.SELECTED == 'true'
        with:
          name: ${{ matrix.rid }}
          path: lib
      - name: Build the test
        if: env.SELECTED == 'true'
        run: dotnet publish test/Smoke -c Release -o app
      # (our V8's local time is UTC whatever the machine's zone: the test checks it in another zone)
      - name: Test
        if: env.SELECTED == 'true' && matrix.dotnet == '' && matrix.docker == '' && runner.os != 'Windows'
        run: TZ=America/New_York dotnet app/Smoke.dll lib
      - name: Test
        if: env.SELECTED == 'true' && matrix.dotnet == '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          tzutil /s "Eastern Standard Time"
          dotnet app/Smoke.dll lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Test (x64 .NET under Rosetta)
        if: env.SELECTED == 'true' && matrix.dotnet == 'x64' && runner.os == 'macOS'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh --channel 8.0 --runtime dotnet --architecture x64 --install-dir "$RUNNER_TEMP/dotnet-x64"
          TZ=America/New_York arch -x86_64 "$RUNNER_TEMP/dotnet-x64/dotnet" app/Smoke.dll lib
      - name: Test (x86 .NET)
        if: env.SELECTED == 'true' && matrix.dotnet == 'x86'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Channel 8.0 -Runtime dotnet -Architecture x86 -InstallDir "$env:RUNNER_TEMP\dotnet-x86"
          tzutil /s "Eastern Standard Time"
          & "$env:RUNNER_TEMP\dotnet-x86\dotnet.exe" app/Smoke.dll lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Set up QEMU
        if: env.SELECTED == 'true' && matrix.docker != ''
        uses: docker/setup-qemu-action@v3
      - name: Test (emulated)
        if: env.SELECTED == 'true' && matrix.docker != ''
        run: >
          docker run --rm --platform ${{ matrix.docker }} -e TZ=America/New_York -v "$PWD:/w" -w /w
          mcr.microsoft.com/dotnet/runtime:8.0 dotnet app/Smoke.dll lib

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built
          pattern: '*-*'
      - name: Package
        run: |
          mkdir dist
          for d in built/*/; do
            rid=$(basename "$d")
            [[ "$rid" == logs-* ]] && continue
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/dist/ClearScriptV8.$rid.zip" .)
          done
          (cd dist && sha256sum *.zip > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "ClearScriptV8 for eight RIDs, V8 15.6.75.33 with SSRS2's patch, ClearScript 7.5.1.1. Checksums in SHA256SUMS; build provenance attested by GitHub."
